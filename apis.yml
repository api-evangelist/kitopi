aid: kitopi
name: Kitopi
description: 'Kitopi is a Dubai-headquartered, tech-powered multi-brand restaurant and cloud kitchen
  platform that discovers, creates and curates homegrown F&B brands for the MENA region. It operates
  over 200 restaurant and delivery-only outlets across the UAE, Saudi Arabia, Bahrain, Qatar and Kuwait
  with more than 6,000 employees, and runs a Global Customer Experience center in Dubai plus a 100-plus
  person technology hub in Krakow, Poland. Kitopi''s differentiator is its in-house Smart Kitchen
  Operating System (SKOS), a suite of applications that optimizes every aspect of cloud-kitchen
  operations in real time to maximize throughput and utilization for its restaurant partners, letting
  a brand scale into a new market in roughly 14 days. Kitopi is a SoftBank Vision Fund portfolio
  company. It publishes no public product or partner developer API; its only machine-readable surface
  is a Wix-provided site MCP endpoint and an llms.txt agent-access declaration on www.kitopi.com.'
