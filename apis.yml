apis:
- aid: kitopi:site-mcp
  name: Kitopi Site MCP
  description: 'The Model Context Protocol endpoint that Kitopi''s Wix-hosted website exposes for
    agentic AI access. It is a platform-provided (Wix) site assistant server rather than a Kitopi
    product API: it lets an agent retrieve live site content, look up business details, search the
    site, mint an anonymous visitor token, and call the site''s underlying Wix REST APIs on a
    visitor''s behalf. No authentication is required to connect and only public site information is
    reachable.'
  humanURL: https://www.kitopi.com/llms.txt
